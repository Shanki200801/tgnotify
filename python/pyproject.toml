[project]
name = "tgnotify"
version = "0.1.1"
description = "Telegram alerts and button approvals for any project. Zero dependencies."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgnotify"]
